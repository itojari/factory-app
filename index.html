<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="工場情報">
<title>工場情報共有</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #f5f4f0; --surface: #fff; --border: #e8e6e0;
    --text: #1a1a18; --muted: #7a7870; --accent: #2d5a3d;
    --accent-light: #e8f0ea; --danger: #8b2020; --danger-light: #fdf0f0;
    --warn: #7a4f00; --warn-light: #fdf5e6; --info: #1a3d6b; --info-light: #eef3fb;
    --r: 12px; --rs: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, 'Helvetica Neue', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; max-width: 480px; margin: 0 auto; min-height: 100vh; }
  .screen { display: none; min-height: 100vh; padding-bottom: 80px; }
  .screen.active { display: block; }
  .header { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 16px; height: 56px; display: flex; align-items: center; gap: 10px; }
  .header-title { font-size: 17px; font-weight: 700; flex: 1; }
  .hbtn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 22px; padding: 6px; border-radius: 50%; display: flex; align-items: center; }
  .hbtn.acc { color: var(--accent); font-size: 15px; font-weight: 600; border-radius: var(--rs); padding: 6px 12px; }
  .search-wrap { padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .search-input { width: 100%; padding: 9px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--rs); font-size: 14px; font-family: inherit; color: var(--text); outline: none; }
  .content { padding: 16px; }
  .factory-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 12px; }
  .ficon { width: 44px; height: 44px; background: var(--accent-light); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .finfo { flex: 1; min-width: 0; }
  .fname { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
  .faddr { font-size: 12px; color: var(--muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; padding: 2px 7px; border-radius: 999px; font-weight: 500; }
  .tag.d { background: var(--danger-light); color: var(--danger); }
  .tag.w { background: var(--warn-light); color: var(--warn); }
  .tag.i { background: var(--info-light); color: var(--info); }
  .add-btn { width: 100%; padding: 14px; border: 1.5px dashed var(--border); border-radius: var(--r); background: none; cursor: pointer; color: var(--muted); font-size: 14px; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .sec-header { display: flex; align-items: center; gap: 8px; padding: 6px 0 10px; margin-top: 8px; }
  .sec-title { font-size: 13px; font-weight: 700; flex: 1; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .sec-add { background: none; border: none; cursor: pointer; color: var(--accent); font-size: 24px; line-height: 1; padding: 0 4px; }
  .entry-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; margin-bottom: 8px; }
  .entry-card.caution { border-left: 3px solid var(--danger); }
  .entry-card.trouble { border-left: 3px solid var(--warn); }
  .entry-content { font-size: 14px; line-height: 1.7; margin-bottom: 8px; }
  .entry-footer { display: flex; align-items: center; justify-content: space-between; }
  .entry-meta { font-size: 11px; color: var(--muted); }
  .entry-edit { background: none; border: none; cursor: pointer; font-size: 11px; color: var(--muted); padding: 3px 8px; border-radius: 4px; font-family: inherit; text-decoration: underline; }
  .contact-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
  .cavatar { width: 40px; height: 40px; background: var(--info-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: var(--info); flex-shrink: 0; }
  .cinfo { flex: 1; }
  .cname { font-size: 14px; font-weight: 700; }
  .crole { font-size: 12px; color: var(--muted); }
  .ctel { font-size: 13px; color: var(--info); font-weight: 500; }
  .cedit { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 18px; padding: 4px; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 20px 20px 0 0; padding: 20px 20px 40px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
  .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-input, .form-select, .form-textarea { width: 100%; padding: 11px 13px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--rs); font-size: 15px; font-family: inherit; color: var(--text); outline: none; }
  .form-textarea { min-height: 100px; resize: vertical; line-height: 1.6; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
  .btn { flex: 1; padding: 13px; border-radius: var(--rs); font-size: 15px; font-family: inherit; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .loading { text-align: center; padding: 40px 16px; color: var(--muted); }
  .spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 24px 16px; color: var(--muted); font-size: 14px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1a1a18; color: #fff; padding: 10px 20px; border-radius: 999px; font-size: 13px; font-weight: 500; z-index: 200; transition: transform 0.25s; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .del-row { text-align: center; margin-top: 8px; }
  .del-link { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--danger); font-family: inherit; text-decoration: underline; }
</style>
</head>
<body>

<div id="screen-list" class="screen active">
  <div class="header">
    <div class="header-title">🏭 工場情報</div>
    <button class="hbtn acc" onclick="openAddFactory()">＋ 追加</button>
  </div>
  <div class="search-wrap">
    <input class="search-input" type="text" placeholder="工場名で検索..." oninput="filterFactories(this.value)" />
  </div>
  <div class="content">
    <div id="factory-list"><div class="loading"><div class="spinner"></div>読み込み中...</div></div>
  </div>
</div>

<div id="screen-detail" class="screen">
  <div class="header">
    <button class="hbtn" onclick="showList()">←</button>
    <div class="header-title" id="detail-title"></div>
    <button class="hbtn" onclick="openEditFactory()">✏️</button>
  </div>
  <div class="content" id="detail-body"></div>
</div>

<div id="modal-factory" class="modal-overlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="mf-title">工場を追加</div>
    <div class="form-group"><label class="form-label">工場名 *</label><input id="f-name" class="form-input" type="text" placeholder="例: 大阪第2工場" /></div>
    <div class="form-group"><label class="form-label">住所</label><input id="f-addr" class="form-input" type="text" placeholder="例: 大阪府大阪市..." /></div>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal('modal-factory')">キャンセル</button>
      <button class="btn primary" onclick="saveFactory()">保存</button>
    </div>
    <div id="fdelrow" class="del-row" style="display:none"><button class="del-link" onclick="deleteFactory()">この工場を削除する</button></div>
  </div>
</div>

<div id="modal-entry" class="modal-overlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="me-title">情報を追加</div>
    <div class="form-group"><label class="form-label">カテゴリ</label>
      <select id="e-cat" class="form-select" onchange="toggleEntryFields()">
        <option value="caution">⚠️ 注意事項・危険箇所</option>
        <option value="trouble">🔧 過去のトラブル事例</option>
        <option value="contact">👤 担当者・連絡先</option>
      </select>
    </div>
    <div id="e-text-fields">
      <div class="form-group"><label class="form-label">内容 *</label><textarea id="e-content" class="form-textarea" placeholder="詳細を入力..."></textarea></div>
    </div>
    <div id="e-contact-fields" style="display:none">
      <div class="form-group"><label class="form-label">名前 *</label><input id="e-cname" class="form-input" type="text" placeholder="例: 田中 一郎" /></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">役職</label><input id="e-crole" class="form-input" type="text" placeholder="現場リーダー" /></div>
        <div class="form-group"><label class="form-label">電話番号</label><input id="e-ctel" class="form-input" type="tel" placeholder="06-0000-0000" /></div>
      </div>
    </div>
    <div class="form-group"><label class="form-label">投稿者名（任意）</label><input id="e-author" class="form-input" type="text" placeholder="例: 山田" /></div>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal('modal-entry')">キャンセル</button>
      <button class="btn primary" onclick="saveEntry()">保存</button>
    </div>
    <div id="edelrow" class="del-row" style="display:none"><button class="del-link" onclick="deleteEntry()">この情報を削除する</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://lcmaooclxqztiutydtxf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Wfz8RQo_FeKS00N8D8eevw_TEmAObYC';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let factories = [];
let currentFactoryId = null;
let editingEntryId = null;
let editingFactory = false;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

async function loadFactories() {
  const { data, error } = await db.from('factories').select('*').order('created_at');
  if (error) { showToast('読み込みエラー: ' + error.message); return; }
  factories = data || [];
  renderList(factories);
}

function renderList(list) {
  const el = document.getElementById('factory-list');
  if (!list.length) { el.innerHTML = '<div class="empty">工場がまだ登録されていません</div>'; return; }
  el.innerHTML = list.map(f => `
    <div class="factory-card" onclick="showDetail('${f.id}')">
      <div class="ficon">🏭</div>
      <div class="finfo">
        <div class="fname">${f.name}</div>
        <div class="faddr">${f.addr || '住所未登録'}</div>
        <div class="tags"><span class="tag i">タップして確認</span></div>
      </div>
      <div style="color:#ccc;font-size:20px">›</div>
    </div>`).join('');
}

function filterFactories(q) { renderList(factories.filter(f => f.name.includes(q))); }

async function showDetail(id) {
  currentFactoryId = id;
  const f = factories.find(x => x.id === id);
  document.getElementById('detail-title').textContent = f.name;
  document.getElementById('screen-list').classList.remove('active');
  document.getElementById('screen-detail').classList.add('active');
  document.getElementById('detail-body').innerHTML = '<div class="loading"><div class="spinner"></div>読み込み中...</div>';
  const { data, error } = await db.from('entries').select('*').eq('factory_id', id).order('created_at');
  if (error) { showToast('エラー: ' + error.message); return; }
  renderDetail(data || []);
}

function renderDetail(entries) {
  const cautions = entries.filter(e => e.cat === 'caution');
  const troubles = entries.filter(e => e.cat === 'trouble');
  const contacts = entries.filter(e => e.cat === 'contact');
  document.getElementById('detail-body').innerHTML = `
    <div>
      <div class="sec-header"><span>⚠️</span><span class="sec-title">注意事項・危険箇所</span><button class="sec-add" onclick="openAddEntry('caution')">＋</button></div>
      ${cautions.map(e => `<div class="entry-card caution"><div class="entry-content">${e.content}</div><div class="entry-footer"><div class="entry-meta">${e.author||'匿名'} · ${fmt(e.created_at)}</div><button class="entry-edit" onclick="openEditEntry('${e.id}')">編集</button></div></div>`).join('') || '<div class="empty">まだ登録されていません</div>'}
    </div>
    <div>
      <div class="sec-header"><span>🔧</span><span class="sec-title">過去のトラブル事例</span><button class="sec-add" onclick="openAddEntry('trouble')">＋</button></div>
      ${troubles.map(e => `<div class="entry-card trouble"><div class="entry-content">${e.content}</div><div class="entry-footer"><div class="entry-meta">${e.author||'匿名'} · ${fmt(e.created_at)}</div><button class="entry-edit" onclick="openEditEntry('${e.id}')">編集</button></div></div>`).join('') || '<div class="empty">まだ登録されていません</div>'}
    </div>
    <div>
      <div class="sec-header"><span>👤</span><span class="sec-title">担当者・連絡先</span><button class="sec-add" onclick="openAddEntry('contact')">＋</button></div>
      ${contacts.map(e => `<div class="contact-card"><div class="cavatar">${(e.name||'?').charAt(0)}</div><div class="cinfo"><div class="cname">${e.name||''}</div><div class="crole">${e.role||''}</div><div class="ctel">${e.tel||''}</div></div><button class="cedit" onclick="openEditEntry('${e.id}')">✏️</button></div>`).join('') || '<div class="empty">まだ登録されていません</div>'}
    </div>`;
}

function fmt(iso) { if (!iso) return ''; const d = new Date(iso); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; }

function showList() {
  document.getElementById('screen-detail').classList.remove('active');
  document.getElementById('screen-list').classList.add('active');
  loadFactories();
}

function openAddFactory() {
  editingFactory = false;
  document.getElementById('mf-title').textContent = '工場を追加';
  document.getElementById('f-name').value = '';
  document.getElementById('f-addr').value = '';
  document.getElementById('fdelrow').style.display = 'none';
  document.getElementById('modal-factory').classList.add('open');
}

function openEditFactory() {
  editingFactory = true;
  const f = factories.find(x => x.id === currentFactoryId);
  document.getElementById('mf-title').textContent = '工場を編集';
  document.getElementById('f-name').value = f.name;
  document.getElementById('f-addr').value = f.addr || '';
  document.getElementById('fdelrow').style.display = 'block';
  document.getElementById('modal-factory').classList.add('open');
}

async function saveFactory() {
  const name = document.getElementById('f-name').value.trim();
  const addr = document.getElementById('f-addr').value.trim();
  if (!name) { showToast('工場名を入力してください'); return; }
  if (editingFactory) {
    const { error } = await db.from('factories').update({ name, addr }).eq('id', currentFactoryId);
    if (error) { showToast('エラー: ' + error.message); return; }
    document.getElementById('detail-title').textContent = name;
    const f = factories.find(x => x.id === currentFactoryId);
    if (f) { f.name = name; f.addr = addr; }
    showToast('更新しました');
  } else {
    const { data, error } = await db.from('factories').insert({ name, addr }).select();
    if (error) { showToast('エラー: ' + error.message); return; }
    factories.push(data[0]);
    closeModal('modal-factory');
    await showDetail(data[0].id);
    showToast('工場を追加しました');
    return;
  }
  closeModal('modal-factory');
}

async function deleteFactory() {
  if (!confirm('この工場と全ての情報を削除しますか？')) return;
  const { error } = await db.from('factories').delete().eq('id', currentFactoryId);
  if (error) { showToast('エラー: ' + error.message); return; }
  closeModal('modal-factory');
  showList();
  showToast('削除しました');
}

function toggleEntryFields() {
  const cat = document.getElementById('e-cat').value;
  document.getElementById('e-contact-fields').style.display = cat === 'contact' ? 'block' : 'none';
  document.getElementById('e-text-fields').style.display = cat === 'contact' ? 'none' : 'block';
}

function openAddEntry(cat) {
  editingEntryId = null;
  document.getElementById('me-title').textContent = '情報を追加';
  document.getElementById('e-cat').value = cat;
  document.getElementById('e-content').value = '';
  document.getElementById('e-author').value = '';
  document.getElementById('e-cname').value = '';
  document.getElementById('e-crole').value = '';
  document.getElementById('e-ctel').value = '';
  document.getElementById('edelrow').style.display = 'none';
  toggleEntryFields();
  document.getElementById('modal-entry').classList.add('open');
}

async function openEditEntry(id) {
  editingEntryId = id;
  const { data } = await db.from('entries').select('*').eq('id', id).single();
  document.getElementById('me-title').textContent = '編集';
  document.getElementById('e-cat').value = data.cat;
  document.getElementById('e-content').value = data.content || '';
  document.getElementById('e-author').value = data.author || '';
  document.getElementById('e-cname').value = data.name || '';
  document.getElementById('e-crole').value = data.role || '';
  document.getElementById('e-ctel').value = data.tel || '';
  document.getElementById('edelrow').style.display = 'block';
  toggleEntryFields();
  document.getElementById('modal-entry').classList.add('open');
}

async function saveEntry() {
  const cat = document.getElementById('e-cat').value;
  const author = document.getElementById('e-author').value.trim() || '匿名';
  let body = { cat, author, factory_id: currentFactoryId };
  if (cat === 'contact') {
    const name = document.getElementById('e-cname').value.trim();
    if (!name) { showToast('名前を入力してください'); return; }
    body = { ...body, name, role: document.getElementById('e-crole').value.trim(), tel: document.getElementById('e-ctel').value.trim() };
  } else {
    const content = document.getElementById('e-content').value.trim();
    if (!content) { showToast('内容を入力してください'); return; }
    body = { ...body, content };
  }
  let error;
  if (editingEntryId) {
    ({ error } = await db.from('entries').update(body).eq('id', editingEntryId));
  } else {
    ({ error } = await db.from('entries').insert(body));
  }
  if (error) { showToast('エラー: ' + error.message); return; }
  closeModal('modal-entry');
  const { data } = await db.from('entries').select('*').eq('factory_id', currentFactoryId).order('created_at');
  renderDetail(data || []);
  showToast(editingEntryId ? '更新しました' : '追加しました');
}

async function deleteEntry() {
  if (!confirm('この情報を削除しますか？')) return;
  const { error } = await db.from('entries').delete().eq('id', editingEntryId);
  if (error) { showToast('エラー: ' + error.message); return; }
  closeModal('modal-entry');
  const { data } = await db.from('entries').select('*').eq('factory_id', currentFactoryId).order('created_at');
  renderDetail(data || []);
  showToast('削除しました');
}

document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); });
});

loadFactories();
</script>
</body>
</html>
