<style>
  :root {
    --bg: #f5f4f0; --surface: #fff; --border: #e8e6e0;
    --text: #1a1a18; --muted: #7a7870; --accent: #2d5a3d;
    --accent-light: #e8f0ea; --danger: #8b2020; --danger-light: #fdf0f0;
    --warn: #7a4f00; --warn-light: #fdf5e6; --info: #1a3d6b; --info-light: #eef3fb;
    --r: 12px; --rs: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, 'Helvetica Neue', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; max-width: 480px; margin: 0 auto; min-height: 100vh; }
  .screen { display: none; min-height: 100vh; padding-bottom: 80px; }
  .screen.active { display: block; }
  .header { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 16px; height: 56px; display: flex; align-items: center; gap: 10px; }
  .header-title { font-size: 17px; font-weight: 700; flex: 1; }
  .hbtn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 22px; padding: 6px; border-radius: 50%; display: flex; align-items: center; }
  .hbtn.acc { color: var(--accent); font-size: 15px; font-weight: 600; border-radius: var(--rs); padding: 6px 12px; }
  .hbtn.admin-badge { color: #fff; background: var(--accent); font-size: 12px; font-weight: 600; border-radius: var(--rs); padding: 5px 10px; }
  .tab-wrap { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
  .tab-btn { flex: 1; padding: 12px 8px; border: none; background: none; font-size: 14px; font-family: inherit; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .search-wrap { padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .search-input { width: 100%; padding: 9px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--rs); font-size: 14px; font-family: inherit; color: var(--text); outline: none; }
  .content { padding: 16px; }
  .factory-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 12px; }
  .ficon { width: 44px; height: 44px; background: var(--accent-light); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .finfo { flex: 1; min-width: 0; }

function openAdminLogin() {

function switchTab(tab) {
  ['factories','updates','disasters','nearmisses'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', tab === t);
    document.getElementById('tab-'+t+'-content').style.display = tab === t ? 'block' : 'none';
  });
  if (tab === 'updates') loadUpdates();
  if (tab === 'disasters') loadDisasters();
  if (tab === 'nearmisses') loadNearMisses();
}

function extractDateFromHeadline(headline) {
  if (!headline) return null;
  // 見出し先頭の "YYYY.M.D" や "YYYY/M/D" 形式の日付を抽出
  const m = headline.match(/^(\d{4})[./](\d{1,2})[./](\d{1,2})/);
  if (!m) return null;
  const [, y, mo, d] = m;
  return new Date(parseInt(y), parseInt(mo) - 1, parseInt(d)).getTime();
}

async function loadUpdates() {
  document.getElementById('updates-list').innerHTML = '<div class="loading"><div class="spinner"></div>読み込み中...</div>';
  const { data, error } = await db.from('entries')
    .select('*, factories(name)')
    .in('cat', ['caution', 'trouble'])
    .limit(1000);
  if (error) { showToast('エラー: ' + error.message); return; }
  // 見出しの日付があれば日付で、なければ作成日時でソート（降順）
  data.sort((a, b) => {
    const da = extractDateFromHeadline(a.headline);
    const db_ = extractDateFromHeadline(b.headline);
    const ta = da !== null ? da : new Date(a.created_at).getTime();
    const tb = db_ !== null ? db_ : new Date(b.created_at).getTime();
    return tb - ta;
  });
  const el = document.getElementById('updates-list');
  if (!data.length) { el.innerHTML = '<div class="empty">まだ登録されていません</div>'; return; }
  el.innerHTML = data.map(e => `
    <div class="update-card ${e.cat}" onclick="goToFactory('${e.factory_id}', '${(e.factories?.name||'').replace(/'/g,"\'")}')">
      <div class="update-factory">🏭 ${e.factories?.name || ''}</div>
      <div class="update-headline">${e.cat === 'caution' ? '⚠️' : '🔧'} ${e.headline || ''}</div>
      <div class="update-meta">
        <span>${e.author || '匿名'}</span>
        <span>${fmt(e.created_at)}</span>
      </div>
    </div>`).join('');
}

async function goToFactory(factoryId, factoryName) {
  const f = factories.find(x => x.id === factoryId);
  if (f) {
    showDetail(factoryId);
  } else {
    const { data } = await db.from('factories').select('*').eq('id', factoryId).single();
    if (data) { factories.push(data); showDetail(factoryId); }
  }
}

let disasterCache = [];
let nearMissCache = [];

async function loadDisasters() {
  document.getElementById('disasters-list').innerHTML = '<div class="loading"><div class="spinner"></div>読み込み中...</div>';
  const { data, error } = await db.from('disaster_cases').select('*').order('created_at', { ascending: false });
  if (error) { showToast('エラー: ' + error.message); return; }
  const el = document.getElementById('disasters-list');
  if (!data || !data.length) { el.innerHTML = '<div class="empty">まだ登録されていません</div>'; return; }
  disasterCache = data;
  el.innerHTML = data.map(d => `
    <div class="factory-card" style="border-left:3px solid #DC2626" onclick="showDisaster('${d.id}')">
      <div class="ficon">🚨</div>
      <div class="finfo">
        <div class="fname">${d.headline}</div>
        <div class="faddr">${d.author||'匿名'} · ${fmt(d.created_at)}</div>
      </div>
      <div style="color:#ccc;font-size:20px">›</div>
    </div>`).join('');
}

function showDisaster(id) {
  const d = disasterCache.find(x => x.id === id);
  if (!d) return;
  document.getElementById('item-title').textContent = d.headline;
  const btn = document.getElementById('item-edit-btn');
  btn.onclick = function() { openEditDisaster(id); };
  document.getElementById('item-body').innerHTML =
    (d.url ? renderMedia(d.url) : '<div style="color:var(--muted);font-size:14px">資料なし</div>') +
    '<div style="margin-top:14px;font-size:12px;color:var(--muted)">' + (d.author||'匿名') + ' · ' + fmt(d.created_at) + '</div>';
  document.getElementById('screen-list').classList.remove('active');
  document.getElementById('screen-item').classList.add('active');
  window.scrollTo(0,0);
}

  editingDisasterId = null;

  document.getElementById('d-headline').value = '';
  document.getElementById('d-url').value = '';

async function openEditDisaster(id) {

async function loadFactories() {
  const { data, error } = await db.from('factories').select('*').order('furigana', { ascending: true, nullsFirst: false }).order('name', { ascending: true });
  if (error) { showToast('読み込みエラー: ' + error.message); return; }
  factories = data || [];
  renderList(factories);
}

function renderList(list) {
  const el = document.getElementById('factory-list');
  if (!list.length) { el.innerHTML = '<div class="empty">工場がまだ登録されていません</div>'; return; }
  el.innerHTML = list.map(f => `
    <div class="factory-card" onclick="showDetail('${f.id}')">
      <div class="ficon">🏭</div>
      <div class="finfo">
        <div class="fname">${f.name}</div>
        <div class="faddr">${f.addr || '住所未登録'}</div>
        <div class="tags"><span class="tag i">タップして確認</span></div>
      </div>
      <div style="color:#ccc;font-size:20px">›</div>
    </div>`).join('');
}

function filterFactories(q) { renderList(factories.filter(f => f.name.includes(q) || (f.furigana && f.furigana.includes(q)))); }

async function showDetail(id) {
  currentFactoryId = id;
  const f = factories.find(x => x.id === id);
  document.getElementById('detail-title').textContent = f.name;
  document.getElementById('screen-item').classList.remove('active');
  document.getElementById('screen-list').classList.remove('active');
  document.getElementById('screen-detail').classList.add('active');
  document.getElementById('detail-body').innerHTML = '<div class="loading"><div class="spinner"></div>読み込み中...</div>';
  const { data, error } = await db.from('entries').select('*').eq('factory_id', id).order('created_at');
  if (error) { showToast('エラー: ' + error.message); return; }
  renderDetail(data || []);
}

function getLabelStyle(color) {
  const styles = {
    'red':    'background:#FECACA;color:#991B1B',
    'orange': 'background:#FED7AA;color:#9A3412',
    'yellow': 'background:#FEF08A;color:#854D0E',
    'blue':   'background:#BFDBFE;color:#1E40AF',
    'green':  'background:#BBF7D0;color:#166534',
  };
  return styles[color] || '';
}

function renderSingleMedia(url) {
  url = url.trim();
  if (!url) return '';
  // Google DriveのURLをembed用に変換
  const driveMatch = url.match(/\/file\/d\/([^/]+)/);
  if (driveMatch) {
    const fileId = driveMatch[1];
    return `<div style="border-radius:8px;overflow:hidden;background:#000;margin-bottom:8px">
      <iframe src="https://drive.google.com/file/d/${fileId}/preview" 
        width="100%" height="220" frameborder="0" allowfullscreen
        style="display:block"></iframe>
    </div>
    <div style="margin-top:-4px;margin-bottom:8px;text-align:right">
      <a href="${url}" target="_blank" style="font-size:11px;color:var(--info)">Google Driveで開く ↗</a>
    </div>`;
  }
  // その他のURLは画像として試みる
  return `<div style="border-radius:8px;overflow:hidden;margin-bottom:8px">
    <img src="${url}" style="width:100%;border-radius:8px;display:block" 
      onerror="this.parentElement.innerHTML='<a href=\'${url}\' target=\'_blank\' style=\'color:var(--info);font-size:13px\'>📎 添付ファイルを開く ↗</a>'" />
  </div>`;
}

function renderMedia(mediaUrl) {
  if (!mediaUrl) return '';
  const urls = mediaUrl.split(/\r?\n/).map(u => u.trim()).filter(u => u);
  if (!urls.length) return '';
  return urls.map(renderSingleMedia).join('');
}

function toggleAccordion(el) { el.classList.toggle('open'); }

function backToList() {
  document.getElementById('screen-item').classList.remove('active');
  document.getElementById('screen-list').classList.add('active');
}




function renderDetail(entries) {
  const sortByHeadlineDate = (a, b) => {
    const da = extractDateFromHeadline(a.headline);
    const db_ = extractDateFromHeadline(b.headline);
    const ta = da !== null ? da : new Date(a.created_at).getTime();
    const tb = db_ !== null ? db_ : new Date(b.created_at).getTime();
    return tb - ta;
  };
  const cautions = entries.filter(e => e.cat === 'caution').sort(sortByHeadlineDate);
  const troubles = entries.filter(e => e.cat === 'trouble').sort(sortByHeadlineDate);
  const contacts = entries.filter(e => e.cat === 'contact');

  const renderAccordion = (e) => `
    <div class="accordion ${e.cat}">
      <div class="accordion-header" onclick="toggleAccordion(this.parentElement)">
        <div class="accordion-headline" ${e.label_color ? 'style="'+getLabelStyle(e.label_color)+';padding:4px 10px;border-radius:6px;display:inline-block"' : ''}>${e.headline || ''}</div>
        <div class="accordion-meta">${e.author||'匿名'}</div>
        <div class="accordion-arrow">▼</div>
      </div>
      <div class="accordion-body">
        <div class="accordion-content">${(e.content||'').replace(/\n/g, '<br>')}</div>
        ${e.media_url ? `<div style="margin-top:10px">${renderMedia(e.media_url)}</div>` : ''}
        ${e.admin_note ? `<div class="admin-only" style="margin-top:10px;padding:10px;background:#fdf0f0;border-radius:8px;border:1px solid #f5c0c0"><div style="font-size:11px;font-weight:700;color:#8b2020;margin-bottom:4px">🔒 管理者メモ（非公開）</div><div style="font-size:13px;line-height:1.6">${e.admin_note}</div></div>` : ""}
        <div class="accordion-footer">
          <div class="accordion-author">${e.author||'匿名'} · ${fmt(e.created_at)}</div>
          <button class="entry-edit" onclick="openEditEntry('${e.id}')">編集</button>
        </div>
      </div>
    </div>`;

  document.getElementById('detail-body').innerHTML = `
    <div>
      <div class="sec-header"><span>⚠️</span><span class="sec-title">注意事項・危険箇所</span><button class="sec-add" onclick="openAddEntry('caution')">＋</button></div>
      ${cautions.map(renderAccordion).join('') || '<div class="empty">まだ登録されていません</div>'}
    </div>
    <div>
      <div class="sec-header"><span>🔧</span><span class="sec-title">過去のトラブル事例</span><button class="sec-add" onclick="openAddEntry('trouble')">＋</button></div>
      ${troubles.map(renderAccordion).join('') || '<div class="empty">まだ登録されていません</div>'}
    </div>
    <div>
      <div class="sec-header"><span>👤</span><span class="sec-title">担当者・連絡先</span><button class="sec-add" onclick="openAddEntry('contact')">＋</button></div>
      ${contacts.map(e => `
        <div class="contact-card">
          <div class="cavatar">${(e.name||'?').charAt(0)}</div>
          <div class="cinfo"><div class="cname">${e.name||''}</div><div class="crole">${e.role||''}</div><div class="ctel">${e.tel ? `<a href="tel:${e.tel}" style="color:var(--info);text-decoration:none;font-weight:500;display:block;padding:8px 0;">${e.tel}</a>` : ''}</div></div>
          <button class="cedit" onclick="openEditEntry('${e.id}')">✏️</button>
        </div>`).join('') || '<div class="empty">まだ登録されていません</div>'}
    </div>`;
}

function fmt(iso) { if (!iso) return ''; const d = new Date(iso); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; }

function showList() {
  document.getElementById('screen-item').classList.remove('active');
  document.getElementById('screen-detail').classList.remove('active');
  document.getElementById('screen-list').classList.add('active');
  loadFactories();
}

function openAddFactory() {
  editingFactory = false;
  document.getElementById('mf-title').textContent = '工場を追加';
  document.getElementById('f-name').value = '';
  document.getElementById('f-furigana').value = '';
  document.getElementById('f-addr').value = '';
  document.getElementById('fdelrow').style.display = 'none';
  document.getElementById('modal-factory').classList.add('open');
}

function openEditFactory() {
  editingFactory = true;
  const f = factories.find(x => x.id === currentFactoryId);
  document.getElementById('mf-title').textContent = '工場を編集';
  document.getElementById('f-name').value = f.name;
  document.getElementById('f-furigana').value = f.furigana || '';
  document.getElementById('f-addr').value = f.addr || '';
  document.getElementById('fdelrow').style.display = 'block';
  document.getElementById('modal-factory').classList.add('open');
}

async function saveFactory() {
  const name = document.getElementById('f-name').value.trim();
  const furigana = document.getElementById('f-furigana').value.trim();
  const addr = document.getElementById('f-addr').value.trim();
  if (!name) { showToast('工場名を入力してください'); return; }
  if (editingFactory) {
    const { error } = await db.from('factories').update({ name, furigana, addr }).eq('id', currentFactoryId);
    if (error) { showToast('エラー: ' + error.message); return; }
    document.getElementById('detail-title').textContent = name;
    const f = factories.find(x => x.id === currentFactoryId);
    if (f) { f.name = name; f.addr = addr; }
    showToast('更新しました');
  } else {
    const { data, error } = await db.from('factories').insert({ name, furigana, addr }).select();
    if (error) { showToast('エラー: ' + error.message); return; }
    factories.push(data[0]);
    closeModal('modal-factory');
    await showDetail(data[0].id);
    showToast('工場を追加しました');
    return;
  }
  closeModal('modal-factory');
}

async function deleteFactory() {
  if (!confirm('この工場と全ての情報を削除しますか？')) return;
  const { error } = await db.from('factories').delete().eq('id', currentFactoryId);
  if (error) { showToast('エラー: ' + error.message); return; }
  closeModal('modal-factory');
  showList();
  showToast('削除しました');
}

function toggleEntryFields() {
  const cat = document.getElementById('e-cat').value;
  document.getElementById('e-contact-fields').style.display = cat === 'contact' ? 'block' : 'none';
  document.getElementById('e-text-fields').style.display = cat === 'contact' ? 'none' : 'block';
}

function openAddEntry(cat) {
  editingEntryId = null;
  document.getElementById('me-title').textContent = '情報を追加';
  document.getElementById('e-cat').value = cat;
  document.getElementById('e-headline').value = '';
  document.querySelectorAll('input[name="label_color"]').forEach(r => r.checked = r.value === '');
  document.getElementById('e-content').value = '';
  document.getElementById('e-author').value = '';
  document.getElementById('e-cname').value = '';
  document.getElementById('e-crole').value = '';
  document.getElementById('e-ctel').value = '';
  document.getElementById('e-admin-note').value = '';
  document.getElementById('e-media-url').value = '';
  document.getElementById('edelrow').style.display = 'none';
  toggleEntryFields();
  document.getElementById('modal-entry').classList.add('open');
}

async function openEditEntry(id) {
  editingEntryId = id;
  const { data } = await db.from('entries').select('*').eq('id', id).single();
  document.getElementById('me-title').textContent = '編集';
  document.getElementById('e-cat').value = data.cat;
  document.getElementById('e-headline').value = data.headline || '';
  document.querySelectorAll('input[name="label_color"]').forEach(r => r.checked = r.value === (data.label_color || ''));
  document.getElementById('e-content').value = data.content || '';
  document.getElementById('e-author').value = data.author || '';
  document.getElementById('e-cname').value = data.name || '';
  document.getElementById('e-crole').value = data.role || '';
  document.getElementById('e-ctel').value = data.tel || '';
  document.getElementById('e-admin-note').value = data.admin_note || '';
  document.getElementById('e-media-url').value = data.media_url || '';
  document.getElementById('edelrow').style.display = 'block';
  toggleEntryFields();
  document.getElementById('modal-entry').classList.add('open');
}

async function saveEntry() {
  const cat = document.getElementById('e-cat').value;
  const author = document.getElementById('e-author').value.trim() || '匿名';
  let body = { cat, author, factory_id: currentFactoryId };
  if (cat === 'contact') {
    const name = document.getElementById('e-cname').value.trim();
    if (!name) { showToast('名前を入力してください'); return; }
    body = { ...body, name, role: document.getElementById('e-crole').value.trim(), tel: document.getElementById('e-ctel').value.trim() };
  } else {
    const headline = document.getElementById('e-headline').value.trim();
    const label_color = document.querySelector('input[name="label_color"]:checked')?.value || '';
    const content = document.getElementById('e-content').value.trim();
    if (!headline) { showToast('見出しを入力してください'); return; }
    if (!content) { showToast('内容を入力してください'); return; }
    const admin_note = document.getElementById('e-admin-note').value.trim();
    const media_url = document.getElementById('e-media-url').value.trim();
    body = { ...body, headline, content, admin_note, media_url, label_color };
  }
  let error;
  if (editingEntryId) {
    ({ error } = await db.from('entries').update(body).eq('id', editingEntryId));
  } else {
    ({ error } = await db.from('entries').insert(body));
  }
  if (error) { showToast('エラー: ' + error.message); return; }
  closeModal('modal-entry');
  const { data } = await db.from('entries').select('*').eq('factory_id', currentFactoryId).order('created_at');
  renderDetail(data || []);
  showToast(editingEntryId ? '更新しました' : '追加しました');
}

async function deleteEntry() {
  if (!confirm('この情報を削除しますか？')) return;
  const { error } = await db.from('entries').delete().eq('id', editingEntryId);
  if (error) { showToast('エラー: ' + error.message); return; }
  closeModal('modal-entry');
  const { data } = await db.from('entries').select('*').eq('factory_id', currentFactoryId).order('created_at');
  renderDetail(data || []);
  showToast('削除しました');
}

document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); });
});

loadFactories();
